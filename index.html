<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flight Tracker – Privacy Protected</title>
  <style>
    html, body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    #map {
      height: 70vh;
      width: 100%;
    }

    #info {
      text-align: center;
      padding: 10px;
      background: #111;
    }

    .label { color: #aaa; }

    #recenter {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      padding: 10px 15px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      margin-top: 10px;
    }

    .last-updated {
      margin-top: 10px;
      font-size: 0.9em;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <button id="recenter">Track Me Again</button>

  <div id="info">
    <p><span class="label">Latitude:</span> <span id="lat">–</span></p>
    <p><span class="label">Longitude:</span> <span id="lng">–</span></p>
    <p><span class="label">Speed:</span> <span id="speed">–</span></p>
    <p><span class="label">Heading:</span> <span id="heading">–</span></p>
    <p><span class="label">Altitude:</span> <span id="alt">–</span></p>
    <p class="last-updated">Last updated: <span id="updated">–</span></p>
  </div>

  <iframe
    src="https://embed.windy.com/embed.html?lat=52.83&lon=-1.33&detailLat=52.83&detailLon=-1.33&width=650&height=450&zoom=6&level=surface&overlay=wind&product=ecmwf&menu=&message=true&marker=&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=kt&metricTemp=%C2%B0C&radarRange=-1"
    loading="lazy">
  </iframe>

  <script>
    const home = { lat: 52.8312, lng: -1.3287 };
    const KM_RADIUS = 1; // Hide true location within 1km

    let map, marker, myLocation;

    function toRadians(deg) {
      return deg * Math.PI / 180;
    }

    function distanceInKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = toRadians(lat2 - lat1);
      const dLng = toRadians(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
                Math.sin(dLng / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function applyPrivacyMask(lat, lng) {
      const distance = distanceInKm(lat, lng, home.lat, home.lng);
      if (distance <= KM_RADIUS) {
        const offset = 0.01 * (Math.random() - 0.5); // ~500m radius
        return {
          lat: lat + offset,
          lng: lng + offset
        };
      }
      return { lat, lng };
    }

    function initMap() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(updatePosition, showError, {
          enableHighAccuracy: true,
          timeout: 10000
        });
      } else {
        alert("Geolocation not supported.");
      }

      document.getElementById("recenter").addEventListener("click", () => {
        if (map && myLocation) {
          map.setCenter(myLocation);
        }
      });
    }

    function updatePosition(position) {
      const { latitude, longitude, speed, heading, altitude } = position.coords;
      const masked = applyPrivacyMask(latitude, longitude);

      myLocation = { lat: masked.lat, lng: masked.lng };

      document.getElementById("lat").textContent = masked.lat.toFixed(6);
      document.getElementById("lng").textContent = masked.lng.toFixed(6);
      document.getElementById("speed").textContent = speed ? speed.toFixed(1) + " m/s" : "–";
      document.getElementById("heading").textContent = heading ? heading.toFixed(1) + "°" : "–";
      document.getElementById("alt").textContent = altitude ? altitude.toFixed(1) + " m" : "–";

      const now = new Date();
      document.getElementById("updated").textContent = now.toLocaleTimeString();

      if (!map) {
        map = new google.maps.Map(document.getElementById("map"), {
          center: myLocation,
          zoom: 15
        });
        marker = new google.maps.Marker({
          position: myLocation,
          map: map,
          title: "Tracking"
        });
      } else {
        marker.setPosition(myLocation);
      }
    }

    function showError(error) {
      document.getElementById("map").innerHTML = "⚠️ " + error.message;
    }
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC1BLMNigTLDbiUqq-McVmLRD5cdwd2fiM&callback=initMap">
  </script>
</body>
</html>
